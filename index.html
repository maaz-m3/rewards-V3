<script>
/* ================= STATE & CONSTANTS ================= */
const C={o:'#FD5108',o2:'#FE7C39',o3:'#FFAA72',d:'#1E293B',g:'#94A3B8',r:'#EF4444',gr:'#10B981',am:'#F59E0B',blue:'#3B82F6',indigo:'#6366F1'};
const COMP={base:C.d,allow:C.o,bonus:C.o3,ben:C.g};
const S={grades:[],benchmarks:[],emps:[],pop:'All',excludeOutliers:false,pStruct:50,pBench:50,pGrade:50,sel:0,tab:'dash',dm:'cost',chip:'All',node:null,est:false,flowScope:'All',
  tb:{pct:50,bw:50,gap:20,allowPct:100,benPct:100,bonusDelta:0,onCost:12,attrRed:3,repl:50,phase:1}};
const PRESETS={'Conservative':{pct:40,bw:50,gap:0,allowPct:90,benPct:90,bonusDelta:0},'Market-aligned':{pct:50,bw:50,gap:20,allowPct:100,benPct:100,bonusDelta:0},'Competitive':{pct:60,bw:60,gap:30,allowPct:105,benPct:105,bonusDelta:2}};
let G=[],E=[],RAW_E=[],K={},charts={};

const MODS=[
 ['dash','Dashboard','M4 5a1 1 0 011-1h5v7H4V5zm10-1h5a1 1 0 011 1v3h-6V4zM4 13h6v7H5a1 1 0 01-1-1v-6zm10-3h6v9a1 1 0 01-1 1h-5V10z'],
 ['struct','Pay structure','M4 20V10m6 10V4m6 16v-7m4 7H2'],
 ['rewards','Total rewards','M12 8c-3 0-6-1-6-2.5S9 3 12 3s6 1 6 2.5S15 8 12 8zM6 5.5v4C6 11 9 12 12 12s6-1 6-2.5v-4M6 9.5v4C6 15 9 16 12 16s6-1 6-2.5v-4M6 13.5v4C6 19 9 20 12 20s6-1 6-2.5v-4'],
 ['bench','Benchmark','M3 17l6-6 4 4 8-8M15 7h6v6'],
 ['work','Workspace','M12 3v4m0 0H5v4m7-4h7v4M3 11h4v4H3zm14 0h4v4h-4zM10 3h4v4h-4z'],
 ['grade','Grade analysis','M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5'],
 ['tobe','To-be design','M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4'],
 ['impact','Financial impact','M12 3v18m4-14h-5a3 3 0 000 6h2a3 3 0 010 6H8']
];
const TITLES={
  dash:'Executive Dashboard',
  struct:'Pay Structure & Bandwidth Matrix',
  rewards:'Total Rewards & Compensation Flow',
  bench:'Market Benchmarking (Multi-Grade Mapping)',
  work:'Organisation Tree & Role Profile',

};

/* ================= HELPERS ================= */
function showMsg(t,b){document.getElementById('msg-title').innerText=t;document.getElementById('msg-body').innerText=b;const m=document.getElementById('msg-modal');m.classList.remove('hidden');m.classList.add('flex')}
function closeMsg(){const m=document.getElementById('msg-modal');m.classList.add('hidden');m.classList.remove('flex')}
const sum=a=>a.reduce((x,y)=>x+y,0), avg=a=>a.length?sum(a)/a.length:0;
const fmt=n=>(n==null||isNaN(n))?'-':Math.round(n).toLocaleString();
const fm=n=>{if(n==null||isNaN(n))return '-';const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':Math.round(a))};
const pc=(n,d=1)=>(n==null||isNaN(n))?'-':n.toFixed(d)+'%';
const sgn=(n,f=fm)=>(n>=0?'+':'')+f(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function quant(s,p){if(!s.length)return 0;const i=(s.length-1)*p/100,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function corr(x,y){const n=x.length;if(n<4)return null;const mx=avg(x),my=avg(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):null}
function mkt(g,p){const pts=[[25,g.p25],[50,g.p50],[75,g.p75],[90,g.p90]];let a=pts[0],b=pts[1];if(p>=50&&p<75){a=pts[1];b=pts[2]}else if(p>=75){a=pts[2];b=pts[3]}return Math.max(0,a[1]+(b[1]-a[1])*(p-a[0])/(b[0]-a[0]))}
function mktPct(g,v){let lo=1,hi=99;for(let i=0;i<30;i++){const m=(lo+hi)/2;mkt(g,m)<v?lo=m:hi=m}return (lo+hi)/2}
const rc=r=>r==null?['No data','bg-slate-100 text-slate-500','#e2e8f0']:r<95?['Lagging','bg-amber-100 text-amber-800','#fde68a']:r>105?['Leading','bg-rose-100 text-rose-800','#fecaca']:['Aligned','bg-emerald-100 text-emerald-800','#bbf7d0'];
const get=k=>k.split('.').reduce((o,p)=>o[p],S);
const SL={};
function sl(key,label,min,max,step,pre='',suf=''){SL[key]={pre,suf};const v=get(key);return `<div><div class="flex justify-between items-center mb-1.5"><label class="text-xs font-semibold text-slate-700">${label}</label><span id="o-${key}" class="text-xs font-bold bg-pwcOrange text-white px-2.5 py-0.5 rounded-md">${pre}${v}${suf}</span></div><input id="i-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="setS('${key}',+this.value)"></div>`}
function syncOut(k){const v=get(k);if(document.getElementById('o-'+k))document.getElementById('o-'+k).innerText=SL[k].pre+v+SL[k].suf;if(document.getElementById('i-'+k))document.getElementById('i-'+k).value=v}
function setS(k,v){const p=k.split('.'),l=p.pop();p.reduce((o,x)=>o[x],S)[l]=v;syncOut(k);renderAll()}
const cv=(id,title,h='h-72',span='',sub='')=>`<div class="card ${span}"><div class="h3">${title}${sub?` <span class="sub">${sub}</span>`:''}</div><div class="relative ${h}"><canvas id="${id}"></canvas></div></div>`;
const kpi=(l,v,s='',col='')=>`<div class="card"><span class="lbl">${l}</span><p class="text-2xl font-extrabold mt-1.5 tracking-tight ${col||'text-slate-900'}">${v}</p>${s?`<p class="text-[11px] text-slate-500 mt-1">${s}</p>`:''}</div>`;
function table(id,heads,rows){const el=document.getElementById(id);if(!el)return;el.innerHTML=`<thead><tr class="bg-slate-50 text-slate-700 border-b border-slate-200 font-bold">${heads.map(h=>`<th class="p-3">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100 text-slate-600">${rows.map(r=>`<tr class="hover:bg-slate-50/80 transition-colors">${r.map((c,i)=>`<td class="p-3 ${i==0?'font-bold text-slate-900':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>`}
const tw=(id,title,sub='')=>`<div class="card p-0 overflow-hidden"><div class="px-5 py-3.5 border-b border-slate-100 flex flex-wrap justify-between items-center gap-2"><div class="h3 mb-0">${title} ${sub?`<span class="sub font-normal ml-1">${sub}</span>`:''}</div></div><div class="overflow-x-auto"><table class="w-full text-left text-xs" id="${id}"></table></div></div>`;
function chart(id,cfg){const el=document.getElementById(id);if(!el)return;if(charts[id])charts[id].destroy();cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,animation:{duration:450,easing:'easeOutQuart'},interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:14,font:{size:11,family:'Inter'}}},tooltip:{backgroundColor:'#0F172A',titleFont:{size:12,family:'Inter'},bodyFont:{size:11,family:'Inter'},padding:10,cornerRadius:8}}},cfg.options||{});charts[id]=new Chart(el,cfg)}
const ySc=(t,x={})=>({y:Object.assign({beginAtZero:true,grid:{color:'#F1F5F9'},title:{display:!!t,text:t,font:{size:11,weight:'600'}}},x),x:{grid:{display:false}}});
const stk=(t,x={})=>({x:{stacked:true,grid:{display:false}},y:Object.assign({stacked:true,beginAtZero:true,grid:{color:'#F1F5F9'},title:{display:!!t,text:t,font:{size:11,weight:'600'}}},x)});
const line=(label,data,color,x={})=>Object.assign({type:'line',label,data,borderColor:color,backgroundColor:color,tension:.25,pointRadius:3.5,pointHoverRadius:6,order:1},x);
const rangeBars=(a,color,label)=>({type:'bar',label,data:a,backgroundColor:color,borderRadius:4,order:2});

/* ================= SAMPLE DATA (12 Client Grades mapped to 6 Benchmark Levels) ================= */
function sampleData(){
  const benchmarks=[
    {bGrade:'BM-1 (Entry)',p25:46000,p50:55000,p75:64000,p90:68500,mAllow:6000,mBonus:5,mBen:8000},
    {bGrade:'BM-2 (Junior)',p25:98000,p50:120000,p75:142000,p90:155000,mAllow:14000,mBonus:8,mBen:16000},
    {bGrade:'BM-3 (Mid)',p25:158000,p50:180000,p75:202000,p90:215000,mAllow:22000,mBonus:10,mBen:24000},
    {bGrade:'BM-4 (Senior)',p25:240000,p50:275000,p75:310000,p90:332000,mAllow:34000,mBonus:12,mBen:36000},
    {bGrade:'BM-5 (Principal)',p25:370000,p50:430000,p75:490000,p90:525000,mAllow:52000,mBonus:15,mBen:55000},
    {bGrade:'BM-6 (Executive)',p25:575000,p50:680000,p75:785000,p90:850000,mAllow:82000,mBonus:20,mBen:85000}
  ];
  const grades=[
    {grade:'Grade 1',bGrade:'BM-1 (Entry)',min:36000,max:62000},
    {grade:'Grade 2',bGrade:'BM-1 (Entry)',min:45000,max:76000},
    {grade:'Grade 3',bGrade:'BM-2 (Junior)',min:72000,max:135000},
    {grade:'Grade 4',bGrade:'BM-2 (Junior)',min:90000,max:168000},
    {grade:'Grade 5',bGrade:'BM-3 (Mid)',min:125000,max:200000},
    {grade:'Grade 6',bGrade:'BM-3 (Mid)',min:150000,max:235000},
    {grade:'Grade 7',bGrade:'BM-4 (Senior)',min:195000,max:315000},
    {grade:'Grade 8',bGrade:'BM-4 (Senior)',min:225000,max:360000},
    {grade:'Grade 9',bGrade:'BM-5 (Principal)',min:295000,max:505000},
    {grade:'Grade 10',bGrade:'BM-5 (Principal)',min:340000,max:580000},
    {grade:'Grade 11',bGrade:'BM-6 (Executive)',min:445000,max:810000},
    {grade:'Grade 12',bGrade:'BM-6 (Executive)',min:520000,max:940000}
  ];
  const roleTemplates=[
    ['Associate',.35,6],['Coordinator',.55,5],['Analyst',.4,6],['Senior Associate',.6,6],
    ['Assistant Manager',.45,7],['Senior Analyst',.6,6],['Manager',.5,7],['Lead Specialist',.72,5],
    ['Senior Manager',.5,6],['Principal',.72,4],['Director',.52,4],['VP',.75,3]
  ];
  const fns=['Finance','Sales','Operations','Technology'];
  let seed=17;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const emps=[];let id=1001;
  grades.forEach((g,idx)=>{
    const bm=benchmarks.find(b=>b.bGrade===g.bGrade)||benchmarks[0];
    const [role,base,n]=roleTemplates[idx%roleTemplates.length];
    for(let i=0;i<n;i++){
      const gender=rnd()<.46?'F':'M', ten=Math.round(rnd()*150)/10, age=Math.round(22+rnd()*20+(idx*1.6));
      let pos=base+(rnd()-.5)*.38+ten*.007-(gender==='F'&&idx%3===0?.06:0);
      if(rnd()<.09)pos=rnd()<.5?-.09-rnd()*.1:1.06+rnd()*.12;
      const b=Math.round((g.min+(g.max-g.min)*pos)/500)*500;
      const at=rnd()<.05?0:bm.mAllow*(.8+rnd()*.4), bn=bm.mBen*(.85+rnd()*.3), bpct=bm.mBonus/100;
      emps.push({id:'EMP-'+(id++),grade:g.grade,role,fn:fns[Math.floor(rnd()*4)],gender,age,ten,base:b,hous:Math.round(at*.55),trans:Math.round(at*.25),oth:Math.round(at*.20),bpct,bonus:Math.round(b*bpct*(.55+rnd()*.85)),med:Math.round(bn*.40),ret:Math.round(bn*.35),ins:Math.round(bn*.15),obn:Math.round(bn*.10)});
    }
  });
  return{grades,benchmarks,emps};
}
function prep(emps){emps.forEach(e=>{e.allow=e.hous+e.trans+e.oth;e.ben=e.med+e.ret+e.ins+e.obn;e.tcc=e.base+e.allow+e.bonus+e.ben})}

/* ================= ANALYTICS ENGINE ================= */
function resolveBenchmark(g,idx,totalGrades){
  if(S.benchmarks && S.benchmarks.length){
    const exact=S.benchmarks.find(b=>b.bGrade===g.bGrade);
    if(exact) return exact;
    const mappedIdx=Math.min(S.benchmarks.length-1,Math.floor(idx*S.benchmarks.length/Math.max(1,totalGrades)));
    return S.benchmarks[mappedIdx];
  }
  const mid=(g.min+g.max)/2;
  return {bGrade:g.grade,p25:g.p25??mid*.88,p50:g.p50??mid,p75:g.p75??mid*1.12,p90:g.p90??mid*1.25,mAllow:g.mAllow??mid*.1,mBonus:g.mBonus??10,mBen:g.mBen??mid*.12};
}

function derive(){
  const basePool=S.emps.filter(e=>S.pop==='All'||e.fn===S.pop);
  RAW_E=basePool;
  const sortedRaw=S.grades.slice().sort((a,b)=>a.min-b.min);
  G=sortedRaw.map((g,idx)=>{
    const bm=resolveBenchmark(g,idx,sortedRaw.length);
    return {...g, bGrade:bm.bGrade, p25:bm.p25, p50:bm.p50, p75:bm.p75, p90:bm.p90, mAllow:bm.mAllow, mBonus:bm.mBonus, mBen:bm.mBen};
  });
  G.forEach((g,i)=>{
    const n=G[i+1], prev=G[i-1];
    g.mid=(g.min+g.max)/2;
    g.bw=(g.max-g.min)/g.min*100;
    g.prog=prev?(g.mid-prev.mid)/prev.mid*100:null;
    g.diff=prev?(g.mid-prev.mid):null;
    g.ovlPrev=prev?Math.max(0,(prev.max-g.min)/(prev.max-prev.min)*100):null;
    g.ovl=n?Math.max(0,(g.max-n.min)/(g.max-g.min)*100):null;
  });

  if(S.excludeOutliers){
    E=basePool.filter(e=>{
      const g=G.find(x=>x.grade===e.grade);
      return g && e.base>=g.min && e.base<=g.max;
    });
  } else {
    E=basePool;
  }

  G.forEach(g=>{
    g.e=E.filter(e=>e.grade===g.grade);
    g.rawE=basePool.filter(e=>e.grade===g.grade);
    g.hc=g.e.length;
    g.sal=g.e.map(e=>e.base).sort((a,b)=>a-b);
    const av=f=>avg(g.e.map(f));
    g.avg=av(e=>e.base);g.aAllow=av(e=>e.allow);g.aBonus=av(e=>e.bonus);g.aBen=av(e=>e.ben);g.aTcc=av(e=>e.tcc);
    g.aHous=av(e=>e.hous);g.aTrans=av(e=>e.trans);g.aOth=av(e=>e.oth);
    g.aMed=av(e=>e.med);g.aRet=av(e=>e.ret);g.aIns=av(e=>e.ins);g.aObn=av(e=>e.obn);
    g.compa=g.hc?g.avg/g.mid*100:null;
    g.pen=g.hc?avg(g.e.map(e=>(e.base-g.min)/(g.max-g.min)*100)):null;
    g.below=g.rawE.filter(e=>e.base<g.min).length;
    g.above=g.rawE.filter(e=>e.base>g.max).length;
    g.bPct=g.hc?av(e=>e.bpct)*100:null;
    const tg=sum(g.e.map(e=>e.base*e.bpct));
    g.payout=tg?sum(g.e.map(e=>e.bonus))/tg*100:null;
    g.mTcc=g.p50+g.mAllow+g.p50*g.mBonus/100+g.mBen;
    const f=g.e.filter(e=>e.gender==='F').map(e=>e.base),m=g.e.filter(e=>e.gender==='M').map(e=>e.base);
    g.gap=f.length>=1&&m.length>=1?(avg(m)-avg(f))/avg(m)*100:null;
    g.fPct=g.hc?(g.e.filter(e=>e.gender==='F').length/g.hc*100):0;
    g.mPct=g.hc?(g.e.filter(e=>e.gender==='M').length/g.hc*100):0;
    g.avgAge=g.hc?av(e=>e.age||32):0;
    g.tcor=corr(g.e.map(e=>e.ten),g.e.map(e=>e.base));
    g.mp=g.hc?mktPct(g,g.avg):null;
  });

  const t=f=>sum(E.map(f)),hc=E.length;
  K={hc,rawHc:basePool.length,base:t(e=>e.base),allow:t(e=>e.allow),bonus:t(e=>e.bonus),ben:t(e=>e.ben),tcc:t(e=>e.tcc),
     hous:t(e=>e.hous),trans:t(e=>e.trans),oth:t(e=>e.oth),med:t(e=>e.med),ret:t(e=>e.ret),ins:t(e=>e.ins),obn:t(e=>e.obn)};
  K.avgBase=hc?K.base/hc:0;K.avgTcc=hc?K.tcc/hc:0;K.medTcc=quant(E.map(e=>e.tcc).sort((a,b)=>a-b),50);
  K.out=sum(G.map(g=>g.below+g.above));K.ten=avg(E.map(e=>e.ten));K.age=avg(E.map(e=>e.age||32));
  const tg=sum(E.map(e=>e.base*e.bpct));K.payout=tg?K.bonus/tg*100:null;
  const w=G.filter(g=>g.gap!=null);K.gap=w.length?sum(w.map(g=>g.gap*g.hc))/sum(w.map(g=>g.hc)):null;
  K.baseVs=hc?sum(G.map(g=>g.avg*g.hc))/sum(G.map(g=>g.p50*g.hc))*100:null;
  K.tccVs=hc?sum(G.map(g=>g.aTcc*g.hc))/sum(G.map(g=>g.mTcc*g.hc))*100:null;
  const cr=(a,b)=>hc?sum(G.map(g=>g[a]*g.hc))/sum(G.map(g=>g[b]*g.hc))*100:null;
  K.allowVs=cr('aAllow','mAllow');K.benVs=cr('aBen','mBen');
  K.bonusVs=hc?sum(G.map(g=>(g.bPct||0)*g.hc))/sum(G.map(g=>g.mBonus*g.hc))*100:null;
}

function toBe(over){
  const p=Object.assign({},S.tb,over);let any=0;
  const T=G.map(g=>{
    const mid=mkt(g,p.pct),min=mid*2/(2+p.bw/100),max=min*(1+p.bw/100);
    const aT=g.mAllow*p.allowPct/100,bT=g.mBen*p.benPct/100,tp=Math.max(0,(g.mBonus+p.bonusDelta)/100),po=(g.payout==null?100:g.payout)/100;
    const t={g,mid,min,max,nb:0,na:0,cB:0,cA:0,cBo:0,cBe:0,nB:0,nA:0,nBo:0,nBe:0};
    g.e.forEach(e=>{
      let b=e.base;if(b<min)b=min;if(b<mid)b+=(mid-b)*p.gap/100;if(b>max&&e.base<=max)b=max;
      const dB=b-e.base,dA=Math.max(0,aT-e.allow),dBo=Math.max(0,b*tp*po-e.bonus),dBe=Math.max(0,bT-e.ben);
      if(e.base<min)t.nb++;if(e.base>max)t.na++;
      t.cB+=dB;t.cA+=dA;t.cBo+=dBo;t.cBe+=dBe;
      if(dB>.5)t.nB++;if(dA>.5)t.nA++;if(dBo>.5)t.nBo++;if(dBe>.5)t.nBe++;if(dB+dA+dBo+dBe>.5)any++;
    });
    t.cOn=p.onCost/100*(t.cB+t.cA+t.cBo);
    t.asTcc=sum(g.e.map(e=>e.tcc));t.asCtc=t.asTcc+p.onCost/100*sum(g.e.map(e=>e.base+e.allow+e.bonus));
    t.inc=t.cB+t.cA+t.cBo+t.cBe;t.toTcc=t.asTcc+t.inc;t.toCtc=t.asCtc+t.inc+t.cOn;
    return t;});
  T.forEach((t,i)=>{const n=T[i+1];t.ovl=n?Math.max(0,(t.max-n.min)/(t.max-t.min)*100):null;t.prog=i?(t.mid/T[i-1].mid-1)*100:null});
  const s=f=>sum(T.map(f));
  const tot={cB:s(t=>t.cB),cA:s(t=>t.cA),cBo:s(t=>t.cBo),cBe:s(t=>t.cBe),cOn:s(t=>t.cOn),nB:s(t=>t.nB),nA:s(t=>t.nA),nBo:s(t=>t.nBo),nBe:s(t=>t.nBe),asTcc:s(t=>t.asTcc),asCtc:s(t=>t.asCtc),toCtc:s(t=>t.toCtc),aff:any,nb:s(t=>t.nb),na:s(t=>t.na)};
  tot.inc=tot.cB+tot.cA+tot.cBo+tot.cBe;tot.incCtc=tot.inc+tot.cOn;tot.toTcc=tot.asTcc+tot.inc;
  tot.save=K.hc*p.attrRed/100*p.repl/100*K.avgBase;
  return{T,tot,p};
}

function renderFlowChart(){
  const wrap=document.getElementById('flow-svg-wrap');
  if(!wrap)return;
  const fns=[...new Set(E.map(e=>e.fn))].sort();
  const selEl=document.getElementById('flow-scope');
  if(selEl){
    const opts=['All',...fns,...E.slice(0,60).map(e=>`EMP:${e.id}`)];
    if(!opts.includes(S.flowScope))S.flowScope='All';
    selEl.innerHTML=`<option value="All" ${S.flowScope==='All'?'selected':''}>Entire Active Scope (${E.length} Staff)</option>`+
      `<optgroup label="By Department / Function">${fns.map(f=>`<option value="${esc(f)}" ${S.flowScope===f?'selected':''}>Department: ${esc(f)}</option>`).join('')}</optgroup>`+
      `<optgroup label="By Individual Employee">${E.slice(0,60).map(e=>`<option value="EMP:${esc(e.id)}" ${S.flowScope==='EMP:'+e.id?'selected':''}>${esc(e.id)} — ${esc(e.role)} (${esc(e.grade)})</option>`).join('')}</optgroup>`;
  }

  let subE=E;
  let titleLbl='Total Compensation Pool';
  if(S.flowScope.startsWith('EMP:')){
    const id=S.flowScope.slice(4);
    subE=E.filter(e=>e.id===id);
    if(subE[0])titleLbl=`${subE[0].id} (${subE[0].role})`;
  } else if(S.flowScope!=='All'){
    subE=E.filter(e=>e.fn===S.flowScope);
    titleLbl=`${S.flowScope} Department`;
  }

  const tot=sum(subE.map(e=>e.tcc))||1;
  const vBase=sum(subE.map(e=>e.base));
  const vAllow=sum(subE.map(e=>e.allow));
  const vBonus=sum(subE.map(e=>e.bonus));
  const vBen=sum(subE.map(e=>e.ben));

  const vHous=sum(subE.map(e=>e.hous));
  const vTrans=sum(subE.map(e=>e.trans));
  const vOth=sum(subE.map(e=>e.oth));
  const vMed=sum(subE.map(e=>e.med));
  const vRet=sum(subE.map(e=>e.ret));
  const vIns=sum(subE.map(e=>e.ins));
  const vObn=sum(subE.map(e=>e.obn));

  const W=920,H=390;
  const colX=[20,330,650],nodeW=220;
  const t2=[
    {name:'Base Salary',val:vBase,col:'#1E293B'},
    {name:'Allowances',val:vAllow,col:'#FD5108'},
    {name:'Variable Bonus',val:vBonus,col:'#FE7C39'},
    {name:'Core Benefits',val:vBen,col:'#3B82F6'}
  ];
  const t3=[
    {name:'Guaranteed Base',val:vBase,col:'#1E293B',p:0},
    {name:'Housing Allowance',val:vHous,col:'#FD5108',p:1},
    {name:'Fuel & Transport',val:vTrans,col:'#FB923C',p:1},
    {name:'Other Allowances',val:vOth,col:'#FDBA74',p:1},
    {name:'Performance Bonus',val:vBonus,col:'#FE7C39',p:2},
    {name:'Medical & Health',val:vMed,col:'#2563EB',p:3},
    {name:'Retirement / Pension',val:vRet,col:'#3B82F6',p:3},
    {name:'Life & Insurance',val:vIns,col:'#60A5FA',p:3},
    {name:'Other Benefits',val:vObn,col:'#93C5FD',p:3}
  ].filter(x=>x.val>0);

  let y2=24,gap2=14,avail2=H-48-gap2*(t2.length-1);
  t2.forEach(n=>{n.h=Math.max(26,(n.val/tot)*avail2);n.y=y2;y2+=n.h+gap2;});

  let y3=16,gap3=8,avail3=H-32-gap3*(t3.length-1);
  t3.forEach(n=>{n.h=Math.max(20,(n.val/tot)*avail3);n.y=y3;y3+=n.h+gap3;});

  const rootH=H-48,rootY=24;
  let paths='';
  let runRoot=rootY;
  t2.forEach((n,idx)=>{
    const sliceH=(n.val/tot)*rootH;
    const x0=colX[0]+nodeW,x1=colX[1];
    const cx=(x0+x1)/2;
    paths+=`<path class="flow-path" d="M${x0},${runRoot} C${cx},${runRoot} ${cx},${n.y} ${x1},${n.y} L${x1},${n.y+n.h} C${cx},${n.y+n.h} ${cx},${runRoot+sliceH} ${x0},${runRoot+sliceH} Z" fill="${n.col}" fill-opacity="0.22"><title>${n.name}: ${fm(n.val)} (${pc(n.val/tot*100,1)})</title></path>`;
    runRoot+=sliceH;
  });

  const pOffsets=[0,0,0,0];
  t3.forEach(n=>{
    const parent=t2[n.p];
    const pRatio=parent.val?(n.val/parent.val):0;
    const sliceH=pRatio*parent.h;
    const sy=parent.y+pOffsets[n.p];
    pOffsets[n.p]+=sliceH;
    const x0=colX[1]+nodeW,x1=colX[2];
    const cx=(x0+x1)/2;
    paths+=`<path class="flow-path" d="M${x0},${sy} C${cx},${sy} ${cx},${n.y} ${x1},${n.y} L${x1},${n.y+n.h} C${cx},${n.y+n.h} ${cx},${sy+sliceH} ${x0},${sy+sliceH} Z" fill="${n.col}" fill-opacity="0.24"><title>${n.name}: ${fm(n.val)} (${pc(n.val/tot*100,1)})</title></path>`;
  });

  let nodes=`<g class="flow-node"><rect x="${colX[0]}" y="${rootY}" width="${nodeW}" height="${rootH}" rx="8" fill="#0F172A"/><text x="${colX[0]+14}" y="${rootY+28}" fill="#94A3B8" font-size="10" font-weight="700">TOTAL PACKAGE</text><text x="${colX[0]+14}" y="${rootY+48}" fill="#FFFFFF" font-size="13" font-weight="700">${esc(titleLbl)}</text><text x="${colX[0]+14}" y="${rootY+74}" fill="#FD5108" font-size="20" font-weight="800">${fm(tot)}</text><text x="${colX[0]+14}" y="${rootY+94}" fill="#CBD5E1" font-size="11">${subE.length} Employee${subE.length===1?'':'s'}</text></g>`;

  t2.forEach(n=>{
    nodes+=`<g class="flow-node"><rect x="${colX[1]}" y="${n.y}" width="${nodeW}" height="${n.h}" rx="6" fill="${n.col}"/><text x="${colX[1]+12}" y="${n.y+n.h/2+4}" fill="#FFFFFF" font-size="11.5" font-weight="700">${n.name}: ${fm(n.val)} (${pc(n.val/tot*100,0)})</text></g>`;
  });

  t3.forEach(n=>{
    nodes+=`<g class="flow-node"><rect x="${colX[2]}" y="${n.y}" width="${nodeW+20}" height="${n.h}" rx="5" fill="#FFFFFF" stroke="${n.col}" stroke-width="1.5"/><rect x="${colX[2]}" y="${n.y}" width="6" height="${n.h}" rx="2" fill="${n.col}"/><text x="${colX[2]+14}" y="${n.y+n.h/2+4}" fill="#0F172A" font-size="11" font-weight="600">${n.name}: <tspan font-weight="700">${fm(n.val)}</tspan> (${pc(n.val/tot*100,1)})</text></g>`;
  });

  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="w-full min-w-[780px] h-auto select-none">${paths}${nodes}</svg>`;
}

const key=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const pick=(o,ns)=>{for(const n of ns)if(o[n]!==undefined&&o[n]!=='')return o[n]};
const num=v=>{if(v===undefined)return;const n=Number(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?undefined:n};
const normRows=ws=>XLSX.utils.sheet_to_json(ws,{defval:''}).map(r=>{const o={};Object.keys(r).forEach(k=>o[key(k)]=r[k]);return o});
function setPopOptions(){const f=[...new Set(S.emps.map(e=>e.fn))].sort();const el=document.getElementById('pop');el.innerHTML=['All',...f].map(x=>`<option>${esc(x)}</option>`).join('');S.pop='All'}

function handleExcelImport(ev){
  const file=ev.target.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}),names=wb.SheetNames;
    const gs=names.find(n=>/grade|band|struct|range/i.test(n))||names[0];
    const bs=names.find(n=>/bench|market|survey/i.test(n)&&n!==gs);
    const es=names.find(n=>/emp|staff|people|roster|incumb/i.test(n))||(names.length>1?names.find(n=>n!==gs&&n!==bs):null);
    let est=false;

    // Parse optional separate Benchmarks sheet (e.g., 6 benchmark levels)
    let benchmarks=[];
    if(bs){
      benchmarks=normRows(wb.Sheets[bs]).map((r,i)=>{
        const p50=num(pick(r,['marketp50','p50','marketmedian','mktp50','midpoint','mid']));
        if(p50==null)return null;
        let bn=num(pick(r,['marketbonustargetpct','marketbonuspct','marketbonus','marketbonustarget']));if(bn!=null&&bn<=1)bn*=100;
        const ma=num(pick(r,['marketallowancesp50','marketallowances','marketallowance'])),mb=num(pick(r,['marketbenefitsp50','marketbenefits']));
        if(ma==null||bn==null||mb==null)est=true;
        return{
          bGrade:String(pick(r,['benchmarkgrade','benchmark','level','grade','band','marketgrade'])??('BM-'+(i+1))).trim(),
          p25:num(pick(r,['marketp25','p25','mktp25']))??p50*.88,
          p50,
          p75:num(pick(r,['marketp75','p75','mktp75']))??p50*1.12,
          p90:num(pick(r,['marketp90','p90','mktp90']))??p50*1.25,
          mAllow:ma??p50*.1,mBonus:bn??10,mBen:mb??p50*.12
        };
      }).filter(Boolean).sort((a,b)=>a.p50-b.p50);
    }

    const rawGrades=normRows(wb.Sheets[gs]).map((r,i)=>{
      const min=num(pick(r,['min','minimum','rangemin','minsalary'])),max=num(pick(r,['max','maximum','rangemax','maxsalary']));if(min==null||max==null||max<=min)return null;
      const mid=(min+max)/2,p50=num(pick(r,['marketp50','p50','marketmedian','mktp50']));
      let bn=num(pick(r,['marketbonustargetpct','marketbonuspct','marketbonus','marketbonustarget']));if(bn!=null&&bn<=1)bn*=100;
      const ma=num(pick(r,['marketallowancesp50','marketallowances','marketallowance'])),mb=num(pick(r,['marketbenefitsp50','marketbenefits']));
      return{
        grade:String(pick(r,['grade','level','band','jobgrade','hostgrade'])??('Grade '+(i+1))).trim(),
        bGrade:String(pick(r,['benchmarkgrade','mappedbenchmark','benchmark','marketgrade','marketlevel'])??'').trim(),
        min,max,mid,
        p25:num(pick(r,['marketp25','p25','mktp25'])),
        p50,
        p75:num(pick(r,['marketp75','p75','mktp75'])),
        p90:num(pick(r,['marketp90','p90','mktp90'])),
        mAllow:ma,mBonus:bn,mBen:mb
      };
    }).filter(Boolean).sort((a,b)=>a.min-b.min);

    if(!rawGrades.length){showMsg('Invalid Grade Sheet','No valid grades found. Ensure your Grades sheet has Grade, Min, and Max columns.');return}

    // If no separate Benchmarks sheet was provided, extract unique benchmark levels from rows that have market data
    if(!benchmarks.length){
      const rowsWithMkt=rawGrades.filter(g=>g.p50!=null);
      if(rowsWithMkt.length>0){
        const seen=new Map();
        rowsWithMkt.forEach((g,idx)=>{
          const keyName=g.bGrade||`Benchmark ${idx+1} (${g.grade})`;
          if(!seen.has(keyName)){
            seen.set(keyName,{
              bGrade:keyName,
              p25:g.p25??g.p50*.88,
              p50:g.p50,
              p75:g.p75??g.p50*1.12,
              p90:g.p90??g.p50*1.25,
              mAllow:g.mAllow??g.p50*.1,
              mBonus:g.mBonus??10,
              mBen:g.mBen??g.p50*.12
            });
          }
        });
        benchmarks=[...seen.values()].sort((a,b)=>a.p50-b.p50);
      }
    }

    // Map each client grade (e.g. 12 grades) to its nearest or explicitly mapped benchmark level (e.g. 6 benchmarks)
    const grades=rawGrades.map(g=>{
      if(benchmarks.length){
        let matched=benchmarks.find(b=>b.bGrade.toLowerCase()===g.bGrade.toLowerCase());
        if(!matched){
          matched=benchmarks.reduce((best,cur)=>Math.abs(cur.p50-g.mid)<Math.abs(best.p50-g.mid)?cur:best,benchmarks[0]);
        }
        return {...g,bGrade:matched.bGrade};
      } else {
        est=true;
        return {...g,bGrade:g.grade,p25:g.mid*.88,p50:g.mid,p75:g.mid*1.12,p90:g.mid*1.25,mAllow:g.mid*.1,mBonus:10,mBen:g.mid*.12};
      }
    });

    let emps=[];
    if(es&&es!==gs)emps=normRows(wb.Sheets[es]).map((r,i)=>{
      let bp=num(pick(r,['bonustargetpct','bonustarget','targetbonus','bonustargetpercent']))||0;if(bp>1)bp/=100;
      const at=num(pick(r,['allowances','totalallowances'])),bt=num(pick(r,['benefits','totalbenefits']));
      const h=num(pick(r,['housingallowance','housing','hra'])),tr=num(pick(r,['transportallowance','transport','fuel','fuelallowance'])),o=num(pick(r,['otherallowance','otherallowances']));
      const hasA=h!=null||tr!=null||o!=null;
      return{id:String(pick(r,['employeeid','empid','id','employee','name'])??('E'+(i+1))),grade:String(pick(r,['grade','level','band','hostgrade'])??'').trim(),role:String(pick(r,['role','designation','title','jobtitle','position'])??'Unspecified').trim(),fn:String(pick(r,['function','department','businessunit'])??'All staff').trim(),
        gender:String(pick(r,['gender','sex'])??'M').trim().charAt(0).toUpperCase(),age:num(pick(r,['age']))??32,ten:num(pick(r,['tenureyears','tenure','yearsofservice']))??0,base:num(pick(r,['basesalary','base','salary','basepay','annualsalary'])),
        hous:h??0,trans:tr??0,oth:hasA?(o??0):(at??0),bpct:bp,bonus:num(pick(r,['bonusactual','bonus','bonuspaid','actualbonus']))??0,
        med:num(pick(r,['medical','healthinsurance']))??0,ret:num(pick(r,['retirement','pension','providentfund']))??0,ins:num(pick(r,['insurance','lifeinsurance']))??0,obn:num(pick(r,['otherbenefits']))??(bt??0)};
    }).filter(x=>x.base!=null&&grades.some(g=>g.grade===x.grade));
    prep(emps);S.grades=grades;S.benchmarks=benchmarks;S.emps=emps;S.est=est;S.sel=0;S.node=null;S.excludeOutliers=false;setPopOptions();
    document.getElementById('data-status').innerText=`${file.name} (${grades.length} grades → ${benchmarks.length||grades.length} benchmarks, ${emps.length} staff)`;
    renderAll();
  }catch(err){console.error(err);showMsg('Import Error','Could not read this file. Please ensure it matches the Excel template format (.xlsx, .xls or .csv).')}ev.target.value=''};
  rd.readAsArrayBuffer(file);
}
function downloadTemplate(){
  const d=sampleData(),wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.grades.map(g=>({Grade:g.grade,BenchmarkGrade:g.bGrade,Min:g.min,Max:g.max}))),'Grades');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.benchmarks.map(b=>({BenchmarkGrade:b.bGrade,MarketP25:b.p25,MarketP50:b.p50,MarketP75:b.p75,MarketP90:b.p90,MarketAllowancesP50:b.mAllow,MarketBonusTargetPct:b.mBonus,MarketBenefitsP50:b.mBen}))),'Benchmarks');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.emps.map(e=>({EmployeeID:e.id,Grade:e.grade,Role:e.role,Function:e.fn,Gender:e.gender,Age:e.age,TenureYears:e.ten,BaseSalary:e.base,HousingAllowance:e.hous,TransportAllowance:e.trans,OtherAllowance:e.oth,BonusTargetPct:e.bpct*100,BonusActual:e.bonus,Medical:e.med,Retirement:e.ret,Insurance:e.ins,OtherBenefits:e.obn}))),'Employees');
  XLSX.writeFile(wb,'rewards-framework-template.xlsx');
}
function exportResults(){
  const X=toBe(),wb=XLSX.utils.book_new(),r1=v=>v==null?'':+v.toFixed(1);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(G.map(g=>({Grade:g.grade,'Mapped Benchmark':g.bGrade,Min:g.min,Midpoint:g.mid,Max:g.max,'Bandwidth %':r1(g.bw),'Overlap %':r1(g.ovlPrev),'Midpoint Progression %':r1(g.prog),'Midpoint Differential':g.diff==null?'':Math.round(g.diff),Headcount:g.hc,'Avg Base':Math.round(g.avg),'Avg Total Rewards':Math.round(g.aTcc),'Compa-ratio %':r1(g.compa),'Market P50':g.p50,'Midpoint vs Market P50 %':r1(g.mid/g.p50*100),'Below Min':g.below,'Above Max':g.above}))),'As-is diagnostic');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(X.T.map(t=>({Grade:t.g.grade,'To-be min':Math.round(t.min),'To-be mid':Math.round(t.mid),'To-be max':Math.round(t.max),'Base cost':Math.round(t.cB),'Allowance cost':Math.round(t.cA),'Bonus cost':Math.round(t.cBo),'Benefit cost':Math.round(t.cBe),'On-costs':Math.round(t.cOn),'Total incremental':Math.round(t.inc),'As-is CTC':Math.round(t.asCtc),'To-be CTC':Math.round(t.toCtc)}))),'To-be and impact');
  XLSX.writeFile(wb,'rewards-analysis.xlsx');
}

window.onload=()=>{
  Chart.defaults.font.size=11;
  Chart.defaults.color='#64748B';
  const d=sampleData();
  prep(d.emps);
  S.grades=d.grades;
  S.benchmarks=d.benchmarks;
  S.emps=d.emps;
  buildShell();
  setPopOptions();
  switchTab('dash');
};
