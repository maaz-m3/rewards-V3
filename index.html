<script>
/* ================= STATE & CONSTANTS ================= */
const C={o:'#FD5108',o2:'#FE7C39',o3:'#FFAA72',d:'#1E293B',g:'#94A3B8',r:'#EF4444',gr:'#10B981',am:'#F59E0B',blue:'#3B82F6',indigo:'#6366F1'};
const COMP={base:C.d,allow:C.o,bonus:C.o3,ben:C.g};
const S={grades:[],emps:[],pop:'All',excludeOutliers:false,pStruct:50,pBench:50,pGrade:50,sel:0,tab:'dash',dm:'cost',chip:'All',node:null,est:false,flowScope:'All',
  tb:{pct:50,bw:50,gap:20,allowPct:100,benPct:100,bonusDelta:0,onCost:12,attrRed:3,repl:50,phase:1}};
const PRESETS={'Conservative':{pct:40,bw:50,gap:0,allowPct:90,benPct:90,bonusDelta:0},'Market-aligned':{pct:50,bw:50,gap:20,allowPct:100,benPct:100,bonusDelta:0},'Competitive':{pct:60,bw:60,gap:30,allowPct:105,benPct:105,bonusDelta:2}};
let G=[],E=[],RAW_E=[],K={},charts={};

const MODS=[
 ['dash','Dashboard','M4 5a1 1 0 011-1h5v7H4V5zm10-1h5a1 1 0 011 1v3h-6V4zM4 13h6v7H5a1 1 0 01-1-1v-6zm10-3h6v9a1 1 0 01-1 1h-5V10z'],
 ['struct','Pay structure','M4 20V10m6 10V4m6 16v-7m4 7H2'],
 ['rewards','Total rewards','M12 8c-3 0-6-1-6-2.5S9 3 12 3s6 1 6 2.5S15 8 12 8zM6 5.5v4C6 11 9 12 12 12s6-1 6-2.5v-4M6 9.5v4C6 15 9 16 12 16s6-1 6-2.5v-4M6 13.5v4C6 19 9 20 12 20s6-1 6-2.5v-4'],
 ['bench','Benchmark','M3 17l6-6 4 4 8-8M15 7h6v6'],
 ['work','Workspace','M12 3v4m0 0H5v4m7-4h7v4M3 11h4v4H3zm14 0h4v4h-4zM10 3h4v4h-4z'],
 ['grade','Grade analysis','M12 3l9 5-9 5-9-5 9-5zM3 12l9 5 9-5M3 16l9 5 9-5'],
 ['tobe','To-be design','M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4'],
 ['impact','Financial impact','M12 3v18m4-14h-5a3 3 0 000 6h2a3 3 0 010 6H8']
];
const TITLES={dash:'Executive Dashboard',struct:'Pay Structure & Progression Diagnostic',rewards:'Total Rewards & Cost Flow Analysis',bench:'Market Benchmarking',work:'Organisation & Role Architecture',grade:'Grade Outlier & Demographic Analysis',tobe:'To-Be Pay Structure Design',impact:'Financial Impact & ROI'};

/* ================= HELPERS ================= */
function showMsg(title,body){
  document.getElementById('msg-title').innerText=title;
  document.getElementById('msg-body').innerText=body;
  const m=document.getElementById('msg-modal');
  m.classList.remove('hidden');m.classList.add('flex');
}
function closeMsg(){
  const m=document.getElementById('msg-modal');
  m.classList.add('hidden');m.classList.remove('flex');
}

const sum=a=>a.reduce((x,y)=>x+y,0), avg=a=>a.length?sum(a)/a.length:0;
const fmt=n=>(n==null||isNaN(n))?'-':Math.round(n).toLocaleString();
const fm=n=>{if(n==null||isNaN(n))return '-';const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':Math.round(a))};
const pc=(n,d=1)=>(n==null||isNaN(n))?'-':n.toFixed(d)+'%';
const sgn=(n,f=fm)=>(n>=0?'+':'')+f(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function quant(s,p){if(!s.length)return 0;const i=(s.length-1)*p/100,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function corr(x,y){const n=x.length;if(n<4)return null;const mx=avg(x),my=avg(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):null}
function mkt(g,p){const pts=[[25,g.p25],[50,g.p50],[75,g.p75],[90,g.p90]];let a=pts[0],b=pts[1];if(p>=50&&p<75){a=pts[1];b=pts[2]}else if(p>=75){a=pts[2];b=pts[3]}return Math.max(0,a[1]+(b[1]-a[1])*(p-a[0])/(b[0]-a[0]))}
function mktPct(g,v){let lo=1,hi=99;for(let i=0;i<30;i++){const m=(lo+hi)/2;mkt(g,m)<v?lo=m:hi=m}return (lo+hi)/2}
const rc=r=>r==null?['No data','bg-slate-100 text-slate-500','#e2e8f0']:r<95?['Lagging','bg-amber-100 text-amber-800','#fde68a']:r>105?['Leading','bg-rose-100 text-rose-800','#fecaca']:['Aligned','bg-emerald-100 text-emerald-800','#bbf7d0'];
const get=k=>k.split('.').reduce((o,p)=>o[p],S);
const SL={};
function sl(key,label,min,max,step,pre='',suf=''){SL[key]={pre,suf};const v=get(key);return `<div><div class="flex justify-between items-center mb-1.5"><label class="text-xs font-semibold text-slate-700">${label}</label><span id="o-${key}" class="text-xs font-bold bg-pwcOrange text-white px-2.5 py-0.5 rounded-full">${pre}${v}${suf}</span></div><input id="i-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${v}" oninput="setS('${key}',+this.value)"></div>`}
function syncOut(k){const v=get(k);if(document.getElementById('o-'+k))document.getElementById('o-'+k).innerText=SL[k].pre+v+SL[k].suf;if(document.getElementById('i-'+k))document.getElementById('i-'+k).value=v}
function setS(k,v){const p=k.split('.'),l=p.pop();p.reduce((o,x)=>o[x],S)[l]=v;syncOut(k);renderAll()}
const cv=(id,title,h='h-72',span='',sub='')=>`<div class="card ${span}"><div class="h3">${title}${sub?` <span class="sub block sm:inline sm:ml-1">${sub}</span>`:''}</div><div class="relative ${h}"><canvas id="${id}"></canvas></div></div>`;
const kpi=(l,v,s='',col='')=>`<div class="card"><span class="lbl">${l}</span><p class="text-2xl font-extrabold mt-1.5 tracking-tight ${col||'text-slate-900'}">${v}</p>${s?`<p class="text-[11px] text-slate-500 mt-1">${s}</p>`:''}</div>`;
function table(id,heads,rows){document.getElementById(id).innerHTML=`<thead><tr class="bg-slate-50 text-slate-700 border-b border-slate-200 font-bold text-[11px] uppercase tracking-wider">${heads.map(h=>`<th class="p-3">${h}</th>`).join('')}</tr></thead><tbody class="divide-y divide-slate-100 text-slate-600">${rows.map(r=>`<tr class="hover:bg-slate-50/80 transition-colors">${r.map((c,i)=>`<td class="p-3 ${i==0?'font-bold text-slate-900':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>`}
const tw=(id,title,sub='')=>`<div class="card p-0 overflow-hidden"><div class="px-5 py-3.5 border-b border-slate-100 flex flex-wrap items-baseline justify-between gap-2"><span class="h3 mb-0">${title}</span>${sub?`<span class="sub">${sub}</span>`:''}</div><div class="overflow-x-auto"><table class="w-full text-left text-xs" id="${id}"></table></div></div>`;
function chart(id,cfg){
  const el=document.getElementById(id);if(!el)return;
  if(charts[id])charts[id].destroy();
  cfg.options=Object.assign({
    responsive:true,maintainAspectRatio:false,
    animation:{duration:650,easing:'easeOutQuart'},
    interaction:{mode:'index',intersect:false},
    plugins:{
      legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#475569'}},
      tooltip:{backgroundColor:'#0F172A',titleFont:{size:12},bodyFont:{size:11},padding:10,cornerRadius:8}
    }
  },cfg.options||{});
  charts[id]=new Chart(el,cfg);
}
const ySc=(t,x={})=>({y:Object.assign({beginAtZero:true,grid:{color:'#F1F5F9'},ticks:{color:'#64748B'},title:{display:!!t,text:t,color:'#475569',font:{weight:'600'}}},x)});
const stk=(t,x={})=>({x:{stacked:true,grid:{display:false},ticks:{color:'#64748B'}},y:Object.assign({stacked:true,beginAtZero:true,grid:{color:'#F1F5F9'},ticks:{color:'#64748B'},title:{display:!!t,text:t,color:'#475569',font:{weight:'600'}}},x)});
const line=(label,data,color,x={})=>Object.assign({type:'line',label,data,borderColor:color,backgroundColor:color,tension:0.3,pointRadius:4,pointHoverRadius:6,borderWidth:2.5,order:1},x);
const rangeBars=(a,color,label)=>({type:'bar',label,data:a,backgroundColor:color,borderRadius:6,order:2});

/* ================= SAMPLE DATA ================= */
function sampleData(){
  const grades=[
    {grade:'Grade 1',min:40000,max:70000,p25:46000,p50:55000,p75:64000,p90:68500,mAllow:6000,mBonus:5,mBen:8000},
    {grade:'Grade 2',min:80000,max:160000,p25:98000,p50:120000,p75:142000,p90:155000,mAllow:14000,mBonus:8,mBen:16000},
    {grade:'Grade 3',min:140000,max:220000,p25:158000,p50:180000,p75:202000,p90:215000,mAllow:22000,mBonus:10,mBen:24000},
    {grade:'Grade 4',min:208600,max:341400,p25:240000,p50:275000,p75:310000,p90:332000,mAllow:34000,mBonus:12,mBen:36000},
    {grade:'Grade 5',min:314986,max:545014,p25:370000,p50:430000,p75:490000,p90:525000,mAllow:52000,mBonus:15,mBen:55000},
    {grade:'Grade 6',min:478779,max:881221,p25:575000,p50:680000,p75:785000,p90:850000,mAllow:82000,mBonus:20,mBen:85000}
  ];
  const roles={'Grade 1':[['Associate',.35,10],['Coordinator',.5,8]],'Grade 2':[['Analyst',.4,12],['Senior Associate',.6,10]],'Grade 3':[['Assistant Manager',.45,14],['Senior Analyst',.6,10]],'Grade 4':[['Manager',.5,14],['Lead Specialist',.75,9]],'Grade 5':[['Senior Manager',.5,10],['Principal',.72,7]],'Grade 6':[['Director',.52,8],['VP',.75,5]]};
  const bp={'Grade 1':.05,'Grade 2':.08,'Grade 3':.10,'Grade 4':.12,'Grade 5':.15,'Grade 6':.20}, aF={'Grade 1':1.05,'Grade 2':.95,'Grade 3':.88,'Grade 4':1.0,'Grade 5':1.05,'Grade 6':1.1}, bF={'Grade 1':1,'Grade 2':1.05,'Grade 3':.9,'Grade 4':.95,'Grade 5':1.05,'Grade 6':1.1};
  const fns=['Finance','Sales','Operations','Technology'];
  let seed=17;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const emps=[];let id=1001;
  grades.forEach(g=>roles[g.grade].forEach(([role,base,n])=>{for(let i=0;i<n;i++){
    const gender=rnd()<.46?'F':'M', ten=Math.round(rnd()*150)/10, age=Math.round(22+rnd()*22+(parseInt(g.grade.replace('Grade ',''))*3));
    let pos=base+(rnd()-.5)*.38+ten*.007-(gender==='F'&&g.grade==='Grade 3'?.06:0);
    if(rnd()<.09)pos=rnd()<.5?-.09-rnd()*.1:1.06+rnd()*.12;
    const b=Math.round((g.min+(g.max-g.min)*pos)/500)*500;
    const at=rnd()<.05?0:g.mAllow*aF[g.grade]*(.8+rnd()*.4), bn=g.mBen*bF[g.grade]*(.85+rnd()*.3);
    emps.push({id:'EMP-'+(id++),grade:g.grade,role,fn:fns[Math.floor(rnd()*4)],gender,age,ten,base:b,hous:Math.round(at*.55),trans:Math.round(at*.25),oth:Math.round(at*.20),bpct:bp[g.grade],bonus:Math.round(b*bp[g.grade]*(.55+rnd()*.85)),med:Math.round(bn*.40),ret:Math.round(bn*.35),ins:Math.round(bn*.15),obn:Math.round(bn*.10)});}}));
  return{grades,emps};
}
function prep(emps){emps.forEach(e=>{e.allow=e.hous+e.trans+e.oth;e.ben=e.med+e.ret+e.ins+e.obn;e.tcc=e.base+e.allow+e.bonus+e.ben})}

/* ================= ANALYTICS ENGINE ================= */
function derive(){
  const basePool=S.emps.filter(e=>S.pop==='All'||e.fn===S.pop);
  RAW_E=basePool;
  G=S.grades.slice().sort((a,b)=>a.min-b.min).map(g=>({...g}));
  G.forEach((g,i)=>{
    const n=G[i+1], prev=G[i-1];
    g.mid=(g.min+g.max)/2;
    g.bw=(g.max-g.min)/g.min*100;
    g.prog=prev?(g.mid-prev.mid)/prev.mid*100:null;
    g.diff=prev?(g.mid-prev.mid):null;
    g.ovlPrev=prev?Math.max(0,(prev.max-g.min)/(prev.max-prev.min)*100):null;
    g.ovl=n?Math.max(0,(g.max-n.min)/(g.max-g.min)*100):null;
  });

  E=S.excludeOutliers?basePool.filter(e=>{
    const g=G.find(x=>x.grade===e.grade);
    return g && e.base>=g.min && e.base<=g.max;
  }):basePool;

  G.forEach(g=>{
    const rawGradeEmps=basePool.filter(e=>e.grade===g.grade);
    g.below=rawGradeEmps.filter(e=>e.base<g.min).length;
    g.above=rawGradeEmps.filter(e=>e.base>g.max).length;
    g.e=E.filter(e=>e.grade===g.grade);
    g.hc=g.e.length;
    g.sal=g.e.map(e=>e.base).sort((a,b)=>a-b);
    const av=f=>avg(g.e.map(f));
    g.avg=av(e=>e.base);g.aAllow=av(e=>e.allow);g.aBonus=av(e=>e.bonus);g.aBen=av(e=>e.ben);g.aTcc=av(e=>e.tcc);
    g.aHous=av(e=>e.hous);g.aTrans=av(e=>e.trans);g.aOth=av(e=>e.oth);g.aMed=av(e=>e.med);g.aRet=av(e=>e.ret);g.aIns=av(e=>e.ins);g.aObn=av(e=>e.obn);
    g.compa=g.hc?g.avg/g.mid*100:null;
    g.pen=g.hc?avg(g.e.map(e=>(e.base-g.min)/(g.max-g.min)*100)):null;
    g.actP25=g.hc?quant(g.sal,25):null;
    g.actP50=g.hc?quant(g.sal,50):null;
    g.actP75=g.hc?quant(g.sal,75):null;
    g.bPct=g.hc?av(e=>e.bpct)*100:null;const tg=sum(g.e.map(e=>e.base*e.bpct));g.payout=tg?sum(g.e.map(e=>e.bonus))/tg*100:null;
    g.mTcc=g.p50+g.mAllow+g.p50*g.mBonus/100+g.mBen;
    const f=g.e.filter(e=>e.gender==='F').map(e=>e.base),m=g.e.filter(e=>e.gender==='M').map(e=>e.base);
    g.gap=f.length>=2&&m.length>=2?(avg(m)-avg(f))/avg(m)*100:null;
    g.tcor=corr(g.e.map(e=>e.ten),g.e.map(e=>e.base));
    g.mp=g.hc?mktPct(g,g.avg):null;
    g.femCount=g.e.filter(e=>e.gender==='F').length;
    g.maleCount=g.hc - g.femCount;
    g.avgAge=g.hc?avg(g.e.map(e=>e.age)):0;
  });

  const t=f=>sum(E.map(f)),hc=E.length;
  K={hc,base:t(e=>e.base),allow:t(e=>e.allow),bonus:t(e=>e.bonus),ben:t(e=>e.ben),tcc:t(e=>e.tcc)};
  K.avgBase=hc?K.base/hc:0;K.avgTcc=hc?K.tcc/hc:0;K.medTcc=quant(E.map(e=>e.tcc).sort((a,b)=>a-b),50);

  const w=G.filter(g=>g.gap!=null);K.gap=w.length?sum(w.map(g=>g.gap*g.hc))/sum(w.map(g=>g.hc)):null;

  K.femTotal=E.filter(e=>e.gender==='F').length;
  K.maleTotal=hc - K.femTotal;
  K.avgAge=avg(E.map(e=>e.age));

  const btnC=document.getElementById('btn-cleanse'), dotC=document.getElementById('cleanse-dot'), lblC=document.getElementById('cleanse-lbl');

      btnC.classList.remove('border-pwcOrange','bg-orange-50','text-pwcOrange');
      dotC.classList.replace('bg-pwcOrange','bg-slate-300');
      lblC.innerText=`Include All Staff (${K.out} outliers)`;
    }
  }
}

function toBe(over){
  const p=Object.assign({},S.tb,over);let any=0;
  const T=G.map(g=>{
    const mid=mkt(g,p.pct),min=mid*2/(2+p.bw/100),max=min*(1+p.bw/100);
    const aT=g.mAllow*p.allowPct/100,bT=g.mBen*p.benPct/100,tp=Math.max(0,(g.mBonus+p.bonusDelta)/100),po=(g.payout==null?100:g.payout)/100;
    const t={g,mid,min,max,nb:0,na:0,cB:0,cA:0,cBo:0,cBe:0,nB:0,nA:0,nBo:0,nBe:0};
    g.e.forEach(e=>{
      let b=e.base;if(b<min)b=min;if(b<mid)b+=(mid-b)*p.gap/100;if(b>max&&e.base<=max)b=max;
      const dB=b-e.base,dA=Math.max(0,aT-e.allow),dBo=Math.max(0,b*tp*po-e.bonus),dBe=Math.max(0,bT-e.ben);
      if(e.base<min)t.nb++;if(e.base>max)t.na++;
      t.cB+=dB;t.cA+=dA;t.cBo+=dBo;t.cBe+=dBe;
      if(dB>.5)t.nB++;if(dA>.5)t.nA++;if(dBo>.5)t.nBo++;if(dBe>.5)t.nBe++;if(dB+dA+dBo+dBe>.5)any++;
    });
    t.cOn=p.onCost/100*(t.cB+t.cA+t.cBo);
    t.asTcc=sum(g.e.map(e=>e.tcc));t.asCtc=t.asTcc+p.onCost/100*sum(g.e.map(e=>e.base+e.allow+e.bonus));
    t.inc=t.cB+t.cA+t.cBo+t.cBe;t.toTcc=t.asTcc+t.inc;t.toCtc=t.asCtc+t.inc+t.cOn;
    return t;});
  T.forEach((t,i)=>{const n=T[i+1];t.ovl=n?Math.max(0,(t.max-n.min)/(t.max-t.min)*100):null;t.prog=i?(t.mid/T[i-1].mid-1)*100:null});
  const s=f=>sum(T.map(f));
  const tot={cB:s(t=>t.cB),cA:s(t=>t.cA),cBo:s(t=>t.cBo),cBe:s(t=>t.cBe),cOn:s(t=>t.cOn),nB:s(t=>t.nB),nA:s(t=>t.nA),nBo:s(t=>t.nBo),nBe:s(t=>t.nBe),asTcc:s(t=>t.asTcc),asCtc:s(t=>t.asCtc),toCtc:s(t=>t.toCtc),aff:any,nb:s(t=>t.nb),na:s(t=>t.na)};
  tot.inc=tot.cB+tot.cA+tot.cBo+tot.cBe;tot.incCtc=tot.inc+tot.cOn;tot.toTcc=tot.asTcc+tot.inc;
  tot.save=K.hc*p.attrRed/100*p.repl/100*K.avgBase;
  return{T,tot,p};
}

function renderRewardsFlow(){
  const scope=S.flowScope;
  const empId=document.getElementById('flow-emp')?.value||'All';
  let targetEmps = scope==='All'?E:E.filter(e=>e.fn===scope);
  if(empId!=='All') targetEmps = targetEmps.filter(e=>e.id===empId);

  const vBase=sum(targetEmps.map(e=>e.base));
  const vHous=sum(targetEmps.map(e=>e.hous)), vTrans=sum(targetEmps.map(e=>e.trans)), vOthA=sum(targetEmps.map(e=>e.oth));
  const vAllow=vHous+vTrans+vOthA;
  const vBonus=sum(targetEmps.map(e=>e.bonus));
  const vMed=sum(targetEmps.map(e=>e.med)), vRet=sum(targetEmps.map(e=>e.ret)), vIns=sum(targetEmps.map(e=>e.ins)), vOthB=sum(targetEmps.map(e=>e.obn));
  const vBen=vMed+vRet+vIns+vOthB;
  const tot=vBase+vAllow+vBonus+vBen || 1;

  const W=920, H=340;
  const pillars=[
    {id:'base',label:'Base Salary',val:vBase,color:C.d},
    {id:'allow',label:'Allowances',val:vAllow,color:C.o},
    {id:'bonus',label:'Performance Bonus',val:vBonus,color:C.o3},
    {id:'ben',label:'Core Benefits',val:vBen,color:C.indigo}
  ];
  const subs=[
    {parent:'base',label:'Guaranteed Base Pay',val:vBase,color:C.d},
    {parent:'allow',label:'Housing Allowance',val:vHous,color:'#EA580C'},
    {parent:'allow',label:'Transport & Fuel',val:vTrans,color:'#F97316'},
    {parent:'allow',label:'Other Allowances',val:vOthA,color:'#FB923C'},
    {parent:'bonus',label:'Variable Cash Bonus',val:vBonus,color:'#F59E0B'},
    {parent:'ben',label:'Medical Coverage',val:vMed,color:'#4F46E5'},
    {parent:'ben',label:'Retirement / Pension',val:vRet,color:'#6366F1'},
    {parent:'ben',label:'Life & Health Insurance',val:vIns,color:'#818CF8'},
    {parent:'ben',label:'Other Benefits',val:vOthB,color:'#94A3B8'}
  ].filter(s=>s.val>0);

  const usableH=280, startY=30;
  let curPillarY=startY;
  const pillarNodes={};
  pillars.forEach(p=>{
    const h=Math.max(20,(p.val/tot)*usableH);
    pillarNodes[p.id]={...p,x:350,y:curPillarY,h,outCursor:curPillarY};
    curPillarY+=h+10;
  });

  let curSubY=startY;
  const subNodes=subs.map(s=>{
    const h=Math.max(16,(s.val/tot)*usableH);
    const node={...s,x:700,y:curSubY,h};
    curSubY+=h+6;
    return node;
  });

  const rootH=Math.max(70, curPillarY-startY-10);
  let rootCursor=startY;

  const ribbon=(x1,y1,h1,x2,y2,h2,col,tip)=>{
    const cx=(x1+x2)/2;
    const d=`M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2} L${x2},${y2+h2} C${cx},${y2+h2} ${cx},${y1+h1} ${x1},${y1+h1} Z`;
    return `<path d="${d}" fill="${col}" fill-opacity="0.25" stroke="${col}" stroke-opacity="0.4" stroke-width="1" class="flow-path"><title>${tip}</title></path>`;
  };

  let pathsHtml='';
  pillars.forEach(p=>{
    const pn=pillarNodes[p.id];
    const hRoot=(p.val/tot)*rootH;
    pathsHtml+=ribbon(170,rootCursor,hRoot,pn.x,pn.y,pn.h,pn.color,`${pn.label}: ${fm(pn.val)} (${pc(pn.val/tot*100)})`);
    rootCursor+=hRoot;
  });
  subNodes.forEach(sn=>{
    const pn=pillarNodes[sn.parent];
    const hIn=pn.val?(sn.val/pn.val)*pn.h:0;
    pathsHtml+=ribbon(pn.x+160,pn.outCursor,hIn,sn.x,sn.y,sn.h,sn.color,`${sn.label}: ${fm(sn.val)} (${pc(sn.val/tot*100)} of total)`);
    pn.outCursor+=hIn;
  });

  const titleLabel=empId==='All'?(scope==='All'?'Total Organisation Pool':`${scope} Department`):`${empId}`;
  const container=document.getElementById('flow-svg-container');
  if(container){
    container.innerHTML=`
      <svg viewBox="0 0 ${W} ${Math.max(H,curSubY+20)}" class="w-full h-auto min-w-[780px] select-none">
        ${pathsHtml}
        <g class="flow-node">
          <rect x="10" y="${startY}" width="160" height="${rootH}" rx="10" fill="#0F172A"/>
          <text x="22" y="${startY+24}" fill="#94A3B8" font-size="10" font-weight="700">TOTAL PACKAGE</text>
          <text x="22" y="${startY+42}" fill="#FFFFFF" font-size="12" font-weight="700">${esc(titleLabel)}</text>
          <text x="22" y="${startY+62}" fill="#FD5108" font-size="15" font-weight="800">${fm(tot)}</text>
          <text x="22" y="${startY+78}" fill="#CBD5E1" font-size="10">${targetEmps.length} employee${targetEmps.length===1?'':'s'}</text>
        </g>
        ${Object.values(pillarNodes).map(pn=>`
          <g class="flow-node">
            <rect x="${pn.x}" y="${pn.y}" width="160" height="${pn.h}" rx="7" fill="${pn.color}"/>
            <text x="${pn.x+10}" y="${pn.y+Math.min(18,pn.h/2+4)}" fill="#FFFFFF" font-size="11" font-weight="700">${pn.label}: ${fm(pn.val)} (${pc(pn.val/tot*100,0)})</text>
          </g>`).join('')}
        ${subNodes.map(sn=>`
          <g class="flow-node">
            <rect x="${sn.x}" y="${sn.y}" width="210" height="${sn.h}" rx="6" fill="#F8FAFC" stroke="${sn.color}" stroke-width="1.5"/>
            <text x="${sn.x+10}" y="${sn.y+Math.min(14,sn.h/2+4)}" fill="#0F172A" font-size="10.5" font-weight="600">${sn.label}: <tspan fill="${sn.color}" font-weight="700">${fm(sn.val)}</tspan> (${pc(sn.val/tot*100,1)})</text>
          </g>`).join('')}
      </svg>
    `;
  }
}

const key=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const pick=(o,ns)=>{for(const n of ns)if(o[n]!==undefined&&o[n]!=='')return o[n]};
const num=v=>{if(v===undefined)return;const n=Number(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?undefined:n};
const normRows=ws=>XLSX.utils.sheet_to_json(ws,{defval:''}).map(r=>{const o={};Object.keys(r).forEach(k=>o[key(k)]=r[k]);return o});
function setPopOptions(){const f=[...new Set(S.emps.map(e=>e.fn))].sort();const el=document.getElementById('pop');el.innerHTML=['All',...f].map(x=>`<option>${esc(x)}</option>`).join('');S.pop='All'}

function handleExcelImport(ev){
  const file=ev.target.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=e=>{try{
    const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}),names=wb.SheetNames;
    const gs=names.find(n=>/grade|band|struct|range/i.test(n))||names[0];
    const es=names.find(n=>/emp|staff|people|roster|incumb/i.test(n))||(names.length>1?names.find(n=>n!==gs):null);
    let est=false;
    const grades=normRows(wb.Sheets[gs]).map((r,i)=>{
      const min=num(pick(r,['min','minimum','rangemin','minsalary'])),max=num(pick(r,['max','maximum','rangemax','maxsalary']));if(min==null||max==null||max<=min)return null;
      const mid=(min+max)/2,p50=num(pick(r,['marketp50','p50','marketmedian','mktp50']))??mid;
      let bn=num(pick(r,['marketbonustargetpct','marketbonuspct','marketbonus','marketbonustarget']));if(bn!=null&&bn<=1)bn*=100;
      const ma=num(pick(r,['marketallowancesp50','marketallowances','marketallowance'])),mb=num(pick(r,['marketbenefitsp50','marketbenefits']));
      if(ma==null||bn==null||mb==null)est=true;
      return{grade:String(pick(r,['grade','level','band','jobgrade','hostgrade'])??('Grade '+(i+1))).trim(),min,max,p25:num(pick(r,['marketp25','p25','mktp25']))??mid*.88,p50,p75:num(pick(r,['marketp75','p75','mktp75']))??mid*1.12,p90:num(pick(r,['marketp90','p90','mktp90']))??mid*1.25,mAllow:ma??p50*.1,mBonus:bn??10,mBen:mb??p50*.12};
    }).filter(Boolean);
    if(!grades.length){showMsg('Invalid Grade Sheet','No valid grades found. Ensure your Grades sheet has Grade, Min, and Max columns.');return}
    let emps=[];
    if(es&&es!==gs)emps=normRows(wb.Sheets[es]).map((r,i)=>{
      let bp=num(pick(r,['bonustargetpct','bonustarget','targetbonus','bonustargetpercent']))||0;if(bp>1)bp/=100;
      const at=num(pick(r,['allowances','totalallowances'])),bt=num(pick(r,['benefits','totalbenefits']));
      const h=num(pick(r,['housingallowance','housing','hra'])),tr=num(pick(r,['transportallowance','transport','fuel','fuelallowance'])),o=num(pick(r,['otherallowance','otherallowances']));
      const hasA=h!=null||tr!=null||o!=null;
      return{id:String(pick(r,['employeeid','empid','id','employee','name'])??('E'+(i+1))),grade:String(pick(r,['grade','level','band','hostgrade'])??'').trim(),role:String(pick(r,['role','designation','title','jobtitle','position'])??'Unspecified').trim(),fn:String(pick(r,['function','department','businessunit'])??'All staff').trim(),
        gender:String(pick(r,['gender','sex'])??'M').trim().charAt(0).toUpperCase(),age:num(pick(r,['age']))??32,ten:num(pick(r,['tenureyears','tenure','yearsofservice']))??0,base:num(pick(r,['basesalary','base','salary','basepay','annualsalary'])),
        hous:h??0,trans:tr??0,oth:hasA?(o??0):(at??0),bpct:bp,bonus:num(pick(r,['bonusactual','bonus','bonuspaid','actualbonus']))??0,
        med:num(pick(r,['medical','healthinsurance']))??0,ret:num(pick(r,['retirement','pension','providentfund']))??0,ins:num(pick(r,['insurance','lifeinsurance']))??0,obn:num(pick(r,['otherbenefits']))??(bt??0)};
    }).filter(x=>x.base!=null&&grades.some(g=>g.grade===x.grade));
    prep(emps);S.grades=grades;S.emps=emps;S.est=est;S.sel=0;S.node=null;S.excludeOutliers=false;setPopOptions();
    document.getElementById('data-status').innerText=`${file.name} (${grades.length} grades, ${emps.length} employees)`;
    renderAll();
  }catch(err){console.error(err);showMsg('Import Error','Could not read this file. Please ensure it matches the Excel template format (.xlsx, .xls or .csv).')}ev.target.value=''};
  rd.readAsArrayBuffer(file);
}

  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(G.map(g=>({Grade:g.grade,Min:g.min,Midpoint:g.mid,Max:g.max,'Bandwidth %':r1(g.bw),'Overlap %':r1(g.ovlPrev),'Midpoint Progression %':r1(g.prog),'Midpoint Differential':g.diff??'',Headcount:g.hc,'Avg Base':Math.round(g.avg),'Actual P25':Math.round(g.actP25||0),'Actual P50':Math.round(g.actP50||0),'Actual P75':Math.round(g.actP75||0),'Avg Allowances':Math.round(g.aAllow),'Avg Bonus':Math.round(g.aBonus),'Avg Benefits':Math.round(g.aBen),'Avg Total Rewards':Math.round(g.aTcc),'Compa-ratio %':r1(g.compa),'Below min':g.below,'Above max':g.above}))),'As-is diagnostic');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(X.T.map(t=>({Grade:t.g.grade,'To-be min':Math.round(t.min),'To-be mid':Math.round(t.mid),'To-be max':Math.round(t.max),'Base cost':Math.round(t.cB),'Allowance cost':Math.round(t.cA),'Bonus cost':Math.round(t.cBo),'Benefit cost':Math.round(t.cBe),'On-costs':Math.round(t.cOn),'Total incremental':Math.round(t.inc),'As-is CTC':Math.round(t.asCtc),'To-be CTC':Math.round(t.toCtc)}))),'To-be and impact');
  XLSX.writeFile(wb,'rewards-analysis.xlsx');
}
